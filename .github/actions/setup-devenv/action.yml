name: Set up devenv
description: Installs devenv, which provides every development tool, and on macOS selects the Xcode that builds Looper.
runs:
  using: composite
  steps:
    - name: Select Xcode
      if: runner.os == 'macOS'
      shell: bash
      run: |
        sudo xcode-select --switch /Applications/Xcode_27.2.app
        xcodebuild -version
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v17
      with:
        name: devenv
    - name: Install devenv
      shell: bash
      run: nix profile install github:cachix/devenv/v2.4.0
